<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Calc</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="flex-cont-vert">
    <div id="out" class="card">
    </div>
    <div class="circle" id="percentCircle">
        <svg viewBox="0 0 120 120">
            <circle class="bg" cx="60" cy="60" r="50"></circle>
            <circle class="fg" cx="60" cy="60" r="50"></circle>
        </svg>
        <div class="percText" id="percentText">0%</div>
    </div>
    <div class="card">
        <input type="date" id="d1">
        <input type="date" id="d2">
        <div id="dateDif" class = "dif"></div>
    </div>
    <div class="circle" id="weekCircle">
        <svg viewBox="0 0 120 120">
            <circle class="bg" cx="60" cy="60" r="50"></circle>
            <circle class="fg" id="c2" cx="60" cy="60" r="50"></circle>
        </svg>
        <div class="percText" id="weekPercText">0%</div>
    </div>
    <div class="card">
        Einrücken
        <input type="date" id="dStart">
        <input type="time" id="tStart">
        <br>
        Abtreten
        <input type="date" id="dEnd">
        <input type="time" id="tEnd">
        <div id="wk" class = "dif"></div>

    </div>
     <div class = "circle" id="dayCircle">
        <svg viewBox="0 0 120 120">
            <circle class="bg" cx="60" cy="60" r="50"></circle>
            <circle class="fg" id = "c3" cx="60" cy="60" r="50"></circle>
        </svg>
        <div class = "percText" id="dayPercText">0%</div>
    </div>



    <script>
        const date1 = document.getElementById("d1");
        const date2 = document.getElementById("d2");
        const dStart = document.getElementById("dStart");
        const dEnd = document.getElementById("dEnd");
        const tStart = document.getElementById("tStart");
        const tEnd = document.getElementById("tEnd");
        const dateDif = document.getElementById("dateDif");
        const weekDIv = document.getElementById("wk");
        const weekPercText = document.getElementById("weekPercText");
        const dayPercText = document.getElementById("dayPercText");
        date1.value = new Date("2026-07-04").toISOString().split("T")[0];
        date2.value = new Date().toISOString().split("T")[0];
        var o = document.getElementById("out");
        const primes = [2, 3, 5];

        function formatTime(duration) {
            const dLength = 1000 * 60 * 60 * 24;
            const hoursTot = duration / 1000 / 3600;
            const days = (duration - (duration % dLength)) / dLength;
            const hours = Math.round(((duration % dLength)) / (1000 * 60 * 60));
            return days + " Tage " + hours + " Stunden (" + Math.round(hoursTot) + "h)";
        }

        function week() {
            const wStart = new Date(dStart.value + 'T' + tStart.value);
            const wEnd = new Date(dEnd.value + 'T' + tEnd.value);
            const wCur = new Date();
            const duration = wEnd - wStart;
            const prog = wCur - wStart;
            const perc = Math.round(prog / duration * 1000000) / 10000;
            const sTot = formatTime(duration);
            const sRest = formatTime(duration - prog);
            wk.textContent = sTot + " noch " + sRest;
            weekPercText.textContent = perc + "%"

            const circle = document.getElementById("c2");

            let p = Math.min(100, Math.max(0, perc)); // clamp 0–100
            let offset = 314 - (314 * p / 100);

            circle.style.strokeDashoffset = offset;

            
        }

        function day (){
            let td = new Date();
            let perc = Math.round((td%(1000*60*60*24))/(1000*60*60*24)*1000000)/10000;
            dayPercText.textContent = perc + "%"

            const circle = document.getElementById("c3");

            let p = Math.min(100, Math.max(0, perc)); // clamp 0–100
            let offset = 314 - (314 * p / 100);

            circle.style.strokeDashoffset = offset;
        }

        function reduce(a, b) {
            primes.forEach(p => {
                while (a % p === 0 && b % p === 0) {
                    a /= p;
                    b /= p;
                }
            })
            return "" + a + "/" + b
        }
        function format(f) {
            l = f.split('.')
            s = l[0]
            c = 0;
            res = "";
            for (let i = s.length - 1; i >= 0; i--) {
                res = s[i] + res
                if (c === 2 && i != 0) {
                    res = '\'' + res;
                }
                c++;
                c %= 3;

            }
            if (l.length === 2) {
                res += '.' + l[1]
            }
            return res
        }
        function updateCircle(perc) {
            const circle = document.querySelector(".fg");
            const text = document.getElementById("percentText");

            let p = Math.min(100, Math.max(0, perc)); // clamp 0–100
            let offset = 314 - (314 * p / 100);

            circle.style.strokeDashoffset = offset;
            text.textContent = Math.round(p * 10000) / 10000 + "%";
        }

        function main() {
            var cur = new Date();
            var start = new Date("2026-06-27T00:00:00"); //decreased by one + two to simplify math
            var mili = cur - start;
            var days = mili / 3600000 / 24;
            var weeks = Math.ceil((days - 2) / 7);
            var perc = days / 3;
            var sold = days * 6 + Math.max(days - 87) * 1.5;
            var eo = days * 69;
            o.textContent = "Tag " + Math.ceil(days) + "/300     |    " + reduce(Math.ceil(days), 300) + "   |   Woche " + weeks + "   |   Sold: " + format('' + Math.round(sold * 100) / 100) + " CHF  |   EO: " + format('' + Math.round(eo * 100) / 100) + " CHF   |    Sekunden: " + format("" + Math.ceil(mili / 1000));
            document.getElementById("percentText").textContent = Math.round(perc * 10000) / 10000 + "%"
            updateCircle(perc)
            week();
            day();
            requestAnimationFrame(main);
        }

        function fDateDif() {
            const d1 = new Date(date1.value);
            const d2 = new Date(date2.value);
            var dif = Math.abs((d1 - d2) / (24 * 60 * 60 * 1000));
            if (dif || dif == 0) {
                dateDif.textContent = dif + " Tage";
            }
        }
        date1.onchange = fDateDif;
        date2.onchange = fDateDif;
        dStart.onchange = week;
        dEnd.onchange = week;
        tStart.onchange = week;
        tEnd.onchange = week;
        fDateDif();
        week();
        main();
    </script>
</body>
<footer>
    <p>Vitus Schneider - 2026</p>
</footer>


</html>
