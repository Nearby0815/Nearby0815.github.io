<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Math</title>
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" />
</head>

<body class="flex-cont-vert">
    <div>
        <div class="timetop" id="timeTot">
            1:20
        </div>
         <div class="time" id="timeLast">
            0:00
        </div>
        <div class="disp" id="out">
            212 * 165
        </div>
        <div class="inp">
            <input type="number" id="in">

        </div>
    </div>

    <script>
        const out = document.getElementById("out");
        const inp = document.getElementById("in");
        const time = document.getElementById("timeTot");
        const timeL = document.getElementById("timeLast");

        var timeS;
        var timeLast;
        var timeCur;

        var v1;
        var v2;

        inp.onclick = (e => {
            timeS = new Date().getTime()
            timeLast = timeS;
        })

        function reroll() {
            v1 = Math.round(Math.random() ** 2 * 40) + 10;
            v2 = Math.round(Math.random() ** 3 * 989) + 10;
            out.textContent = v1 + " | " + v2;
            timeCur = new Date().getTime();
            if (timeS) {
                time.textContent = formatTime(timeCur - timeS) ;
                timeL.textContent = formatTime(timeCur - timeLast) ;
            } else {
                time.textContent = "0:00"
            }
            
            timeLast = timeCur;
            timeCur = new Date().getTime();
        }

        inp.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                enter();
            }
        });

        function check(result) {
            if (result == v1 * v2 || result == v1 + v2 || result == v1 - v2 || result == v1 / v2) {
                out.style.backgroundColor = "green";
            } else {
                out.style.backgroundColor = "red";
            }
        }

        function enter() {
            check(inp.value);
            reroll();
            inp.value = "";
        }

        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            var millis = ms % 1000;
            if (millis<10){
                millis = '00'+millis;
            }else if (millis<100){
                millis = '0'+millis;
            }

            if (minutes>0){
                return `${minutes}:${seconds}:${millis}`;
            } else {
                return `${seconds}:${millis}`;
            }
        }




        reroll();
    </script>
</body>
<footer>
    <p>Vitus Schneider - 2026</p>
</footer>


</html>
